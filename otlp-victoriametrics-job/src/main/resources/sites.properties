# One entry per Kafka cluster; certificates are read from ${KAFKA_CERT_DIR}/<id>/{client.p12,server-ca.p12}
kafka.my.bootstrap=kafka-0-my.dhl.com:443,kafka-1-my.dhl.com:443,kafka-2-my.dhl.com:443
kafka.cz.bootstrap=kafka-0-cz.dhl.com:443,kafka-1-cz.dhl.com:443,kafka-2-cz.dhl.com:443

# Topic is otel.metrics.<site>; region and datacenter become Prometheus labels.
site.mykulocp1023.kafka=my
site.mykulocp1023.region=my
site.mykulocp1023.datacenter=mykul

site.mytpmocp1009.kafka=my
site.mytpmocp1009.region=my
site.mytpmocp1009.datacenter=mytpm

site.czchoocp1038.kafka=cz
site.czchoocp1038.region=cz
site.czchoocp1038.datacenter=czcho

site.czchooct1391.kafka=cz
site.czchooct1391.region=cz
site.czchooct1391.datacenter=czcho

site.czstlocp1025.kafka=cz
site.czstlocp1025.region=cz
site.czstlocp1025.datacenter=czstl
