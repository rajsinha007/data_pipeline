global:
  defaultStorageClass: "csi-vsphere-block"
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10

overrideConfiguration:
  default.replication.factor: 3
  min.insync.replicas: 3
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 3
  log.retention.ms: 604800000      # 7 days
  log.retention.bytes: -1

listeners:
  external:
    containerPort: 9095
    protocol: SASL_SSL
    name: EXTERNAL
    sslClientAuth: "required"

sasl:
  client:
    users:
      - user1
    passwords: "FWLXK5G527"

tls:
  type: PEM
  autoGenerated:
    customAltNames:
      - kafka-0-my.dhl.com
      - kafka-1-my.dhl.com
      - kafka-2-my.dhl.com



controller:
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 212Mi
    limits:
      cpu: 3
      memory: 1024Mi


  persistence:
    size: 2Gi


externalAccess:
  enabled: true
  controller:
    service:
      type: ClusterIP
      ports:
        external: 443

      loadBalancerNames:
      - kafka-0-my.dhl.com
      - kafka-1-my.dhl.com
      - kafka-2-my.dhl.com


      domain: "kafka-0-my.dhl.com" 