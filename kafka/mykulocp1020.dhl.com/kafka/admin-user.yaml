---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: '*'
          patternType: literal
        operations:
          - Read
          - Write
          - Describe
          - Create
      - resource:
          type: group
          name: '*'
          patternType: literal
        operations:
          - Read
          - Write
          - Describe
          - Create