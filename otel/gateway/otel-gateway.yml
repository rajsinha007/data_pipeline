apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway
  namespace: its-otel-oss
spec:
  mode: deployment
  replicas: 1
  image: otel/opentelemetry-collector-contrib:0.158.0
  serviceAccount: otel-agent
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: AWS_SECRET_ACCESS_KEY
    # Compatibility with the internal S3 service; do not enable gzip uploads.
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: WHEN_REQUIRED
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: WHEN_REQUIRED

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi
  volumes:
    - name: kafka-mtls
      secret:
        secretName: kafka-mtls
  volumeMounts:
    - name: kafka-mtls
      mountPath: /etc/otel/kafka
      readOnly: true
  config:
    receivers:
      kafka:
        brokers:
          - kafka-0-cz.dhl.com:443
          - kafka-1-cz.dhl.com:443
          - kafka-2-cz.dhl.com:443
        metrics:
          topics: [otel.metrics.czchooct1237]
          encoding: otlp_json
        group_id: otel-gateway-metrics
        client_id: otel-gateway
        initial_offset: latest
        autocommit:
          enable: true
          interval: 1s
        # No asynchronous batch/queue: mark only after synchronous export succeeds.
        message_marking:
          after: true
          on_error: false
          on_permanent_error: false
        # Keep failed messages uncommitted and retry processing automatically.
        error_backoff:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
        tls:
          ca_file: /etc/otel/kafka/ca.crt
          cert_file: /etc/otel/kafka/tls.crt
          key_file: /etc/otel/kafka/tls.key
          insecure_skip_verify: false
      kafka/s3:
        brokers:
          - kafka-0-cz.dhl.com:443
          - kafka-1-cz.dhl.com:443
          - kafka-2-cz.dhl.com:443
        metrics:
          topics: [otel.metrics.czchooct1237]
          encoding: otlp_json
        # Independent offsets: Prometheus failures do not block this consumer.
        group_id: otel-s3-metrics
        client_id: otel-gateway-s3
        # A new group archives new messages only, not the existing backlog.
        initial_offset: latest
        autocommit:
          enable: true
          interval: 1s
        message_marking:
          after: true
          on_error: false
          on_permanent_error: false
        error_backoff:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
        tls:
          ca_file: /etc/otel/kafka/ca.crt
          cert_file: /etc/otel/kafka/tls.crt
          key_file: /etc/otel/kafka/tls.key
          insecure_skip_verify: false
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 64
    exporters:
      prometheusremotewrite:
        endpoint: http://czcholspc003782.prg-dc.dhl.com:9090/api/v1/write
        # Disabling the queue makes HTTP delivery part of receiver processing.
        remote_write_queue:
          enabled: false
        max_batch_request_parallelism: 1
        timeout: 30s
        resource_to_telemetry_conversion:
          enabled: true
      awss3/metrics:
        marshaler: otlp_json
        timeout: 30s
        s3uploader:
          region: czcho
          s3_bucket: bs96708-dppc-aiops-mimir-blocks
          endpoint: https://czcho.s3.dhl.com
          s3_force_path_style: true
          s3_prefix: otel-gateway/metrics
          s3_partition_format: 'year=%Y/month=%m/day=%d/hour=%H'
          s3_partition_timezone: UTC
        # Return upload failures directly to the independent Kafka receiver.
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
          max_elapsed_time: 20s
    service:
      pipelines:
        metrics:
          receivers: [kafka]
          processors: [memory_limiter]
          exporters: [prometheusremotewrite]
        metrics/s3:
          receivers: [kafka/s3]
          processors: [memory_limiter]
          exporters: [awss3/metrics]
