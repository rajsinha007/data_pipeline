apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: its-otel-oss
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: agent
  namespace: its-otel-oss
spec:
  mode: daemonset
  serviceAccount: otel-agent
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  env:
    - name: K8S_CLUSTER_NAME
      value: czchooct1237
    - name: DC_REGION
      value: cz
    - name: DC_NAME
      value: Chodov
    - name: DC_ENVIRONMENT
      value: test
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  image: otel/opentelemetry-collector-contrib:0.158.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  volumes:
    - name: hostfs
      hostPath:
        path: /
        type: Directory
    - name: kafka-mtls
      secret:
        secretName: kafka-mtls
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
    - name: kafka-mtls
      mountPath: /etc/otel/kafka
      readOnly: true
  config:
    receivers:
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          network: {}
          load: {}
      prometheus:
        config:
          scrape_configs:
            - job_name: cilium-hubble
              scrape_interval: 30s
              static_configs:
                - targets: ["localhost:9965"]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 192
        spike_limit_mib: 64
      resource/node:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
          - key: dc.region
            value: ${env:DC_REGION}
            action: upsert
          - key: dc.name
            value: ${env:DC_NAME}
            action: upsert
          - key: dc.environment
            value: ${env:DC_ENVIRONMENT}
            action: upsert
          - key: host.name
            value: ${env:KUBE_NODE_NAME}
            action: upsert
          - key: k8s.node.name
            value: ${env:KUBE_NODE_NAME}
            action: upsert
      batch:
        send_batch_size: 500
        send_batch_max_size: 500
    exporters:
      kafka/metrics:
        brokers:
          - "kafka-0-cz.dhl.com:443"
          - "kafka-1-cz.dhl.com:443"
          - "kafka-2-cz.dhl.com:443"
        tls:
          ca_file: /etc/otel/kafka/ca.crt
          cert_file: /etc/otel/kafka/tls.crt
          key_file: /etc/otel/kafka/tls.key
          insecure_skip_verify: false
        metrics:
          topic: otel.metrics.czchooct1237
          encoding: otlp_json
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, prometheus]
          processors: [memory_limiter, resource/node, batch]
          exporters: [kafka/metrics]
